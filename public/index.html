      justify-content: center;

    }
    #root:empty::after {
      content: '<VT/>';
      font-family: 'Space Mono', monospace;
      font-size: 1.5rem;
      color: #00e5a0;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
